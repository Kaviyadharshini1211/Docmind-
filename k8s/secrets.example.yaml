apiVersion: v1
kind: Secret
metadata:
  name: docmind-secrets
type: Opaque
stringData:
  MONGO_URI: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/docmind?retryWrites=true&w=majority"
  JWT_SECRET: "replace_with_strong_random_secret"
  GROQ_API_KEY: "gsk_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  PINECONE_API_KEY: "pcsk_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  PINECONE_HOST: "https://docmind-xxxx.svc.aped-xxxx.pinecone.io"
  GRAFANA_ADMIN_PASSWORD: "replace_with_strong_grafana_password"
