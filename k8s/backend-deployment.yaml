# k8s/backend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docmind-backend
  labels:
    app: docmind-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docmind-backend
  template:
    metadata:
      labels:
        app: docmind-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: docmind-backend
          # ✅ pulls from Docker Hub — replace with your username
          image: kaviya1211/docmind-backend:latest
          imagePullPolicy: Always    # always pull latest from Docker Hub
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "production"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: docmind-secrets
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: docmind-secrets
                  key: JWT_SECRET
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: docmind-secrets
                  key: GROQ_API_KEY
            - name: PINECONE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: docmind-secrets
                  key: PINECONE_API_KEY
            - name: PINECONE_HOST
              valueFrom:
                secretKeyRef:
                  name: docmind-secrets
                  key: PINECONE_HOST
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10