# k8s/grafana-datasource-configmap.yaml
# Auto-provisions Prometheus as the default Grafana datasource.
# Grafana reads files in /etc/grafana/provisioning/datasources/ on startup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-config
  labels:
    app: grafana
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: "15s"
